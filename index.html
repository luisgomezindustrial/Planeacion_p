<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PLANEACION</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family:'Segoe UI', sans-serif;
            overflow-x:hidden;
        }

        nav {
            position: fixed;
            top:0;
            width:100%;
            height:70px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            display:flex;
            justify-content:center;
            align-items:center;
            gap:30px;
            z-index:1000;
        }

        nav a {
            color:white;
            text-decoration:none;
            font-weight:600;
            cursor:pointer;
        }

        .page {
            display: none;
            height:100vh;
            width:100vw;
            padding:70px 10%;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
        }

        .page.active {
            display: flex;
        }

        h1 { font-size:3rem; margin-bottom:20px; }
        p { max-width:700px; font-size:1.2rem; }

        #DISTRIBUCION { background: linear-gradient(135deg,#e4e4e5,#fdfcfd); color:white; }
        #STOCK { background:#f4f4f4; }
        #PROGRAMA { background:white; }
        #HORNOS { background:#111; color:white; }

        form {
            display:flex;
            flex-direction:column;
            gap:10px;
            margin-bottom:20px;
        }

        input, button {
            padding:10px;
            border-radius:5px;
            border:none;
            width:250px;
        }

        button {
            background:#333;
            color:white;
            cursor:pointer;
        }
    </style>
</head>
<body>

<nav>
    <a onclick="showPage('DISTRIBUCION')">DISTRIBUCION</a>
    <a onclick="showPage('STOCK')">STOCK</a>
    <a onclick="showPage('PROGRAMA')">PROGRAMA</a>
    <a onclick="showPage('HORNOS')">HORNOS</a>
</nav>

<section id="DISTRIBUCION" class="page active">
    <h1>Distribución</h1>

    <form>
        <input type="file" accept=".jpg,.png,.pdf" required>
        <button type="button">Subir Archivo</button>
    </form>

    <p>Solo se permiten archivos JPG, PNG o PDF (máx. 5MB).</p>
</section>

<section id="STOCK" class="page">
    <h1>Stock</h1>
    <p>Diseño web, desarrollo moderno y optimización</p>
</section>

<section id="PROGRAMA" class="page">
    <h1>Programa</h1>
    <p>Creamos experiencias web limpias, modernas y funcionales</p>
</section>

<section id="HORNOS" class="page">
    <h1>Hornos</h1>
    <p>contacto@ejemplo.com</p>
</section>

<script>
    function showPage(id){
        document.querySelectorAll('.page').forEach(page => {
            page.classList.remove('active');
        });
        document.getElementById(id).classList.add('active');
    }
</script>

</body>
</html>
